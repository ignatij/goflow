name: GoFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal pkg)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet code
        run: go vet ./...

      - name: Lint code
        uses: golangci/golangci-lint-action@v8.0.0

      - name: Run tests
        env:
          DB_USERNAME: testuser
          DB_PASSWORD: testpass
          DB_NAME: goflow_test
        run: go test -race -count=1 -shuffle=on ./...

      - name: Build
        run: make build
